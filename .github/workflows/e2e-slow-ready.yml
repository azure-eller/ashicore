name: E2E Slow Ready

on:
  pull_request:
    types:
      - ready_for_review

concurrency:
  group: e2e-slow-ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  DATABASE_URL_APP: postgresql://app_user:postgres@localhost:5432/postgres
  BETTER_AUTH_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: ci-test-secret-not-for-production
  TEST_BASE_URL: http://127.0.0.1:3000
  EMAIL_OUTBOX_ONLY: "1"

jobs:
  e2e-slow:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inventory
            spec: test/e2e/slow/inventory-form.spec.ts
          - name: purchasing
            spec: test/e2e/slow/purchasing-order.spec.ts
          - name: stocktake
            spec: test/e2e/slow/stocktake.spec.ts
          - name: manufacturing
            spec: test/e2e/slow/manufacturing-order.spec.ts
          - name: sales
            spec: test/e2e/slow/sales-order.spec.ts
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Create app_user role
        run: psql "$DATABASE_URL" -c "CREATE ROLE app_user WITH LOGIN PASSWORD 'postgres';"

      - name: Run migrations
        run: pnpm drizzle-kit migrate

      - name: Start app
        run: pnpm dev > /tmp/erp-dev.log 2>&1 &

      - name: Wait for app
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/auth/ok > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "App did not become ready in time."
          cat /tmp/erp-dev.log
          exit 1

      - name: Run slow operational suite
        run: EMAIL_OUTBOX_ONLY=1 pnpm exec playwright test ${{ matrix.spec }}

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-slow-artifacts-${{ matrix.name }}
          path: |
            playwright-report
            test-results
            /tmp/erp-dev.log
          if-no-files-found: ignore

  e2e-auth:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Create app_user role
        run: psql "$DATABASE_URL" -c "CREATE ROLE app_user WITH LOGIN PASSWORD 'postgres';"

      - name: Run migrations
        run: pnpm drizzle-kit migrate

      - name: Start app
        run: pnpm dev > /tmp/erp-auth-dev.log 2>&1 &

      - name: Wait for app
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/auth/ok > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "App did not become ready in time."
          cat /tmp/erp-auth-dev.log
          exit 1

      - name: Run auth regression suite
        run: pnpm test:e2e:auth

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-artifacts
          path: |
            playwright-report
            test-results
            /tmp/erp-auth-dev.log
          if-no-files-found: ignore
