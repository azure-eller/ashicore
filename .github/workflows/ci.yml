name: CI

on:
  pull_request:
    types:
      - opened
      - labeled
      - reopened
      - ready_for_review
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  DATABASE_URL_APP: postgresql://app_user:postgres@localhost:5432/postgres
  BETTER_AUTH_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: ci-test-secret-not-for-production
  TEST_BASE_URL: http://127.0.0.1:3000

jobs:
  migration-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration order
        run: pnpm verify:migration-order

  production-migration-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:ready') && github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PR migrations against production ledger
        run: |
          if [ -z "$PRODUCTION_DATABASE_URL" ]; then
            echo "::notice::PRODUCTION_DATABASE_URL is not configured; skipping production migration order verification."
            exit 0
          fi
          pnpm verify:production-migration-order

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:ready')) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migrations are idempotent (static)
        run: pnpm db:check-migrations

      - name: Create app_user role
        run: psql "$DATABASE_URL" -c "CREATE ROLE app_user WITH LOGIN PASSWORD 'postgres';"

      - name: Run migrations
        run: pnpm drizzle-kit migrate

      - name: Verify database schema
        run: pnpm verify:db-schema

      - name: Build
        run: pnpm build

  migration-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:ready') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_APP: postgresql://app_user:postgres@localhost:5432/postgres
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install base dependencies
        run: pnpm install --frozen-lockfile

      - name: Create app_user role
        run: psql "$DATABASE_URL" -c "CREATE ROLE app_user WITH LOGIN PASSWORD 'postgres';"

      - name: Run base migrations
        run: pnpm drizzle-kit migrate

      - name: Detect 0121 shipment-line allocation fixture need
        id: migration_fixture_0121
        run: |
          if git cat-file -e HEAD:drizzle/0121_retire_shipment_line_allocations.sql; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed 0121 shipment-line allocation fixture
        if: steps.migration_fixture_0121.outputs.needed == 'true'
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO inventory.unit_definitions (id, organization_id, name, size, uom)
          VALUES ('00000000-0000-4000-8000-000000012101', 'migration-0121-org', 'Each', 1, 'each');

          INSERT INTO inventory.items (
            id,
            organization_id,
            name,
            item_type,
            unit_definition_id,
            sellable
          )
          VALUES (
            '00000000-0000-4000-8000-000000012102',
            'migration-0121-org',
            'Migration 0121 Item',
            'product',
            '00000000-0000-4000-8000-000000012101',
            true
          );

          INSERT INTO sales.customers (id, organization_id, name)
          VALUES ('00000000-0000-4000-8000-000000012103', 'migration-0121-org', 'Migration 0121 Customer');

          INSERT INTO sales.sales_orders (
            id,
            organization_id,
            order_number,
            customer_id,
            customer_name,
            status,
            order_date
          )
          VALUES (
            '00000000-0000-4000-8000-000000012104',
            'migration-0121-org',
            'SO-0121-MIGRATION',
            '00000000-0000-4000-8000-000000012103',
            'Migration 0121 Customer',
            'open',
            CURRENT_DATE
          );

          INSERT INTO sales.sales_order_lines (
            id,
            sales_order_id,
            item_id,
            item_name,
            unit_name,
            quantity,
            unit_price,
            line_total
          )
          VALUES (
            '00000000-0000-4000-8000-000000012105',
            '00000000-0000-4000-8000-000000012104',
            '00000000-0000-4000-8000-000000012102',
            'Migration 0121 Item',
            'Each',
            10,
            1,
            10
          );

          INSERT INTO sales.sales_shipments (
            id,
            organization_id,
            sales_order_id,
            shipment_number,
            sequence,
            status,
            order_number,
            customer_name
          )
          VALUES
            (
              '00000000-0000-4000-8000-000000012106',
              'migration-0121-org',
              '00000000-0000-4000-8000-000000012104',
              'SHIP-0121-A',
              1,
              'planned',
              'SO-0121-MIGRATION',
              'Migration 0121 Customer'
            ),
            (
              '00000000-0000-4000-8000-000000012107',
              'migration-0121-org',
              '00000000-0000-4000-8000-000000012104',
              'SHIP-0121-B',
              2,
              'planned',
              'SO-0121-MIGRATION',
              'Migration 0121 Customer'
            );

          INSERT INTO sales.sales_shipment_lines (
            id,
            sales_shipment_id,
            sales_order_line_id,
            item_id,
            item_name,
            unit_name,
            quantity
          )
          VALUES
            (
              '00000000-0000-4000-8000-000000012108',
              '00000000-0000-4000-8000-000000012106',
              '00000000-0000-4000-8000-000000012105',
              '00000000-0000-4000-8000-000000012102',
              'Migration 0121 Item',
              'Each',
              2
            ),
            (
              '00000000-0000-4000-8000-000000012109',
              '00000000-0000-4000-8000-000000012107',
              '00000000-0000-4000-8000-000000012105',
              '00000000-0000-4000-8000-000000012102',
              'Migration 0121 Item',
              'Each',
              3
            );

          INSERT INTO inventory.stock_allocations (
            id,
            organization_id,
            demand_type,
            demand_id,
            item_id,
            source_type,
            source_id,
            quantity,
            status,
            notes
          )
          VALUES
            (
              '00000000-0000-4000-8000-000000012110',
              'migration-0121-org',
              'sales_shipment_line',
              '00000000-0000-4000-8000-000000012108',
              '00000000-0000-4000-8000-000000012102',
              'inventory_lot',
              '00000000-0000-4000-8000-000000012113',
              2,
              'active',
              'active shipment-line allocation A'
            ),
            (
              '00000000-0000-4000-8000-000000012111',
              'migration-0121-org',
              'sales_shipment_line',
              '00000000-0000-4000-8000-000000012109',
              '00000000-0000-4000-8000-000000012102',
              'inventory_lot',
              '00000000-0000-4000-8000-000000012113',
              3,
              'active',
              'active shipment-line allocation B'
            ),
            (
              '00000000-0000-4000-8000-000000012112',
              'migration-0121-org',
              'sales_shipment_line',
              '00000000-0000-4000-8000-000000012109',
              '00000000-0000-4000-8000-000000012102',
              'inventory_lot',
              '00000000-0000-4000-8000-000000012114',
              1,
              'consumed',
              'historical consumed allocation'
            );
          SQL

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: true

      - name: Point origin at base repository
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"

      - name: Install PR dependencies
        run: pnpm install --frozen-lockfile

      - name: Check PR migration order
        run: pnpm db:check-migrations

      - name: Run PR migrations
        run: pnpm drizzle-kit migrate

      - name: Verify 0121 shipment-line allocation migration fixture
        if: steps.migration_fixture_0121.outputs.needed == 'true'
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            parent_qty numeric;
            cancelled_active_count integer;
            consumed_history_count integer;
          BEGIN
            SELECT COALESCE(SUM(quantity), 0)
            INTO parent_qty
            FROM inventory.stock_allocations
            WHERE organization_id = 'migration-0121-org'
              AND demand_type = 'sales_order_line'
              AND demand_id = '00000000-0000-4000-8000-000000012105'
              AND item_id = '00000000-0000-4000-8000-000000012102'
              AND source_type = 'inventory_lot'
              AND source_id = '00000000-0000-4000-8000-000000012113'
              AND status = 'active';

            IF ROUND(parent_qty, 4) <> 5 THEN
              RAISE EXCEPTION '0121 fixture expected parent sales-line allocation quantity 5, found %', parent_qty;
            END IF;

            SELECT COUNT(*)
            INTO cancelled_active_count
            FROM inventory.stock_allocations
            WHERE id IN (
                '00000000-0000-4000-8000-000000012110',
                '00000000-0000-4000-8000-000000012111'
              )
              AND demand_type = 'sales_shipment_line'
              AND status = 'cancelled'
              AND cancelled_at IS NOT NULL
              AND notes LIKE '%retire_sales_shipment_line_allocations%'
              AND notes LIKE '%prior_demand_id%';

            IF cancelled_active_count <> 2 THEN
              RAISE EXCEPTION '0121 fixture expected 2 cancelled active shipment-line rows with prior attribution, found %', cancelled_active_count;
            END IF;

            SELECT COUNT(*)
            INTO consumed_history_count
            FROM inventory.stock_allocations
            WHERE id = '00000000-0000-4000-8000-000000012112'
              AND demand_type = 'sales_shipment_line'
              AND demand_id = '00000000-0000-4000-8000-000000012109'
              AND status = 'consumed'
              AND notes = 'historical consumed allocation';

            IF consumed_history_count <> 1 THEN
              RAISE EXCEPTION '0121 fixture expected consumed shipment-line history to keep original attribution';
            END IF;
          END $$;
          SQL

      - name: Verify upgraded database schema
        run: pnpm verify:db-schema

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:ready')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:ready'))) }}
    env:
      EMAIL_OUTBOX_ONLY: "1"
      PLAYWRIGHT_FAST_WORKERS: "4"
      # Fixed build sha so the fast lane proves /api/version exposes it (the
      # support triage routine's deploy witness) rather than accepting null.
      VERCEL_GIT_COMMIT_SHA: "0123456789abcdef0123456789abcdef01234567"
      # Fake Stripe credentials for the billing entitlement seam: webhook
      # signatures verify against this secret; the fake API key forces
      # handleStripeWebhook onto its event-payload fallback (no network).
      STRIPE_SECRET_KEY: sk_test_ci_fake
      STRIPE_WEBHOOK_SECRET: whsec_ci_fake
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Create app_user role
        run: psql "$DATABASE_URL" -c "CREATE ROLE app_user WITH LOGIN PASSWORD 'postgres';"

      - name: Run migrations
        run: pnpm drizzle-kit migrate

      - name: Build app
        run: pnpm build

      - name: Start app
        run: pnpm start > /tmp/erp-dev.log 2>&1 &

      - name: Wait for app
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/auth/ok > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "App did not become ready in time."
          cat /tmp/erp-dev.log
          exit 1

      - name: Run fast Playwright suite
        run: pnpm test

      # Runs before the reconciliation suite on purpose: that suite seeds
      # deliberate projection drift (a lot balance with no event behind it) to
      # prove the repair path, and leaves it in the shared org.
      - name: Verify inventory kernel and projections
        run: pnpm verify:inventory

      - name: Run reconciliation Playwright suite
        run: pnpm test:reconciliation


      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
            /tmp/erp-dev.log
          if-no-files-found: ignore
