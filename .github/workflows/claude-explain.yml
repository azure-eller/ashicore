name: Claude PR Explain

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  explain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Explain PR changes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Explain every change in this PR to someone learning JavaScript, TypeScript, and React.

            For each file changed:
            1. What was it before and what is it now
            2. WHY the change was made
            3. Explain any syntax or patterns a Python developer wouldn't recognize
            4. If there's a shadcn/TanStack/Next.js pattern being used, explain it

            Keep it conversational and simple.
          settings: |
            {
              "permissions": {
                "defaultMode": "bypassPermissions"
              }
            }
